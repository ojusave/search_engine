name: Proof agent tests
on:
  push:
    branches: [proof-agent-takehome]
  pull_request:
    paths:
      - 'proof-agent/**'
      - '.github/workflows/proof-agent.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'proof-agent/pyproject.toml'
      - name: Install
        run: pip install -e './proof-agent[dev]'
      - name: Lint
        run: ruff check proof-agent
      - name: Test
        run: pytest -q proof-agent/tests
      - name: Compile
        run: python -m compileall -q proof-agent/src proof-agent/app.py
